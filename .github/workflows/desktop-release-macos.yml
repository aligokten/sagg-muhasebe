name: Build Desktop App (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS DMG (Apple Silicon)
    # macos-14 ve sonrası Apple Silicon; uygulama M serisi işlemcilerde
    # yerel (arm64) çalışsın diye bu çalıştırıcı kullanılıyor.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          CI: false

      - name: Build macOS installer
        # Apple Developer sertifikası yok; electron-builder anahtarlıkta
        # sertifika aramasın. Ayrıca --publish never: imzasız macOS sürümü
        # electron-updater ile güncellenemediği için Release'e latest-mac.yml
        # yüklenmemeli, yoksa Windows güncelleme akışının yanına çalışmayan
        # bir macOS kanalı eklenmiş olur.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --arm64 --publish never

      - name: Verify signature inside the DMG
        # Kullanıcıya giden asıl dosyayı denetler: .dmg bağlanıp içindeki
        # uygulamanın imzası doğrulanır. İmzasız bir paket Apple Silicon'da
        # açılmaz, macOS onu kurcalanmış sayıp Çöp Sepeti'ne taşır — bu adım
        # böyle bir paketin derlemeden çıkmasını engeller.
        run: |
          set -euo pipefail
          dmg=$(ls release/*.dmg)
          echo "Denetlenen paket: $dmg"
          baglanti=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$baglanti"
          trap 'hdiutil detach "$baglanti" -quiet || true' EXIT
          uygulama=$(ls -d "$baglanti"/*.app)
          echo "Denetlenen uygulama: $uygulama"
          codesign --verify --deep --strict --verbose=2 "$uygulama"
          codesign --display --verbose=2 "$uygulama"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAGG-Muhasebe-macOS
          path: release/*.dmg
